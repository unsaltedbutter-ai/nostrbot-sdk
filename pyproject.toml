[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nostrbot-sdk"
version = "0.1.0"
description = "High-level toolkit for building Nostr bots: NIP-04/17 DMs, NIP-57 zaps, LNURL-pay"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Unsalted Butter", email = "noreply@unsaltedbutter.ai" }]
requires-python = ">=3.11"
keywords = ["nostr", "bot", "nip-17", "nip-57", "zap", "lightning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "nostr-sdk==0.44.2",
    "bolt11>=2.1.0",
]

[project.optional-dependencies]
lnurl = ["httpx>=0.27"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/unsaltedbutter-ai/nostrbot-sdk"
Issues = "https://github.com/unsaltedbutter-ai/nostrbot-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/nostrbot_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
